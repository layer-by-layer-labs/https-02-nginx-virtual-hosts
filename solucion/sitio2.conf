# SOLUCIÓN DE REFERENCIA. Intenta resolver el laboratorio antes de abrir este archivo.
# Avería: al copiar sitio1.conf se cambiaron server_name y X-Bloque, pero no root.
# El bloque correcto respondía, pero leía los archivos del directorio de sitio1.
server {
    listen 80;
    server_name sitio2.lab.test;
    add_header X-Bloque "sitio2" always;
    root /usr/share/nginx/html/sitio2;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
