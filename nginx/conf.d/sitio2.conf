# Server block de sitio2.lab.test, creado a partir de una copia de sitio1.conf.
# Este archivo contiene una avería. Tu tarea: diagnosticarla y corregirla.
server {
    listen 80;
    server_name sitio2.lab.test;
    add_header X-Bloque "sitio2" always;
    root /usr/share/nginx/html/sitio1;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
